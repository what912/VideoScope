{
  "sample_fps": 2.0,
  "thumbnail_max_size": 640,
  "enabled_detectors": [
    "near_black",
    "possible_freeze",
    "scene_relative_blur",
    "global_flicker"
  ],
  "detector_configurations": {
    "near_black": {
      "mean_luma_threshold": 0.08,
      "dark_pixel_threshold": 0.1,
      "dark_pixel_ratio": 0.95,
      "min_duration_seconds": 1.0,
      "merge_gap_seconds": 0.25
    }
  },
  "keep_workspace": false,
  "output_directory": "runs/config-example",
  "locale": "en",
  "json_only": false,
  "bundle_video": false
}
