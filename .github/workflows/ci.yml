name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: React dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked front-end dependencies
        working-directory: web
        run: npm ci

      - name: Test dashboard
        working-directory: web
        run: npm test

      - name: Build packaged dashboard assets
        working-directory: web
        run: npm run build

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Generate deterministic video fixtures
        run: python scripts/generate_test_videos.py --force

      - name: Run repository verification
        run: python scripts/verify.py

  distribution:
    name: Build and smoke-test distribution
    runs-on: ubuntu-latest
    needs:
      - frontend
      - test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Generate deterministic video fixtures
        run: python scripts/generate_test_videos.py --force

      - name: Build wheel and source archive
        run: python -m build

      - name: Audit distribution contents
        run: python scripts/audit_distribution.py dist

      - name: Smoke-test wheel in a clean virtual environment
        run: python scripts/smoke_test.py --dist dist --video tests/fixtures/generated/black_segment.mp4

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: genvideoscope-distributions
          path: dist/*
          if-no-files-found: error
