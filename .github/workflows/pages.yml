name: Deploy public site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Generate project-authored media
        working-directory: site
        run: npm run media:prepare

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Type-check
        working-directory: site
        run: npm run typecheck

      - name: Test
        working-directory: site
        run: npm test

      - name: Build
        working-directory: site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SHARE_ENABLED: ${{ vars.VITE_SUPABASE_SHARE_ENABLED }}
          VITE_WINDOWS_INSTALLER_URL: ${{ vars.VITE_WINDOWS_INSTALLER_URL }}
          VITE_WINDOWS_INSTALLER_SHA256: ${{ vars.VITE_WINDOWS_INSTALLER_SHA256 }}
        run: npm run build

      - name: Verify local media and build output
        working-directory: site
        run: npm run media:verify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
