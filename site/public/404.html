  <body>
    <p>Opening VideoScope…</p>
    <script>
      (function () {
        var appBase = "/VideoScope/";
        var storageKey = "videoscope:pages-route";
        var payload = {
          origin: window.location.origin,
          pathname: window.location.pathname,
          search: window.location.search,
          hash: window.location.hash
        };

        try {
          window.sessionStorage.setItem(storageKey, JSON.stringify(payload));
        } catch (_error) {
          try {
            window.sessionStorage.removeItem(storageKey);
          } catch (_storageError) {
            // Continue to the app shell when storage is blocked.
          }
        }

        window.location.replace(window.location.origin + appBase);
      })();
    </script>
  </body>
