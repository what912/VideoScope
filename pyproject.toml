[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genvideoscope"
version = "0.7.0.dev0"
description = "Local-first diagnostics for generated video quality."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "VideoScope contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "numpy>=1.26,<2.5",
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "scenedetect-headless>=0.7.1,<0.8",
    "jinja2>=3.1",
    "platformdirs>=4",
]

[project.optional-dependencies]
ai = [
    "torch>=2.2",
    "torchvision>=0.17",
    "open-clip-torch>=2.24",
]
ocr = [
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
]
asr = [
    "faster-whisper>=1.1",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
all = [
    "torch>=2.2",
    "torchvision>=0.17",
    "open-clip-torch>=2.24",
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "faster-whisper>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "setuptools>=77",
    "wheel>=0.45",
    "httpx2>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
videoscope = "videoscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"videoscope.reporting" = ["templates/*.j2"]
"videoscope.web" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "optional: requires explicitly installed local model dependencies and cache",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "videoscope.cli"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "videoscope.web.app"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*", "videoscope.domain", "videoscope.domain.*"]
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["scenedetect", "scenedetect.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "test_cli",
    "test_distribution_audit",
    "test_fixture_factory",
    "rescue.*",
    "privacy.*",
    "resolve.*",
    "web.*",
]
disallow_untyped_decorators = false
warn_unused_ignores = false
