name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install fixed FFmpeg 8.1.2 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool_prefix="${RUNNER_TEMP}/videoscope-ffmpeg-8.1.2"
          if [ -e "$tool_prefix" ]; then
            printf 'Refusing to reuse FFmpeg prefix: %s\n' "$tool_prefix" >&2
            exit 1
          fi
          if [ -z "${CONDA:-}" ]; then
            printf 'GitHub runner did not expose the Miniconda root.\n' >&2
            exit 1
          fi
          conda_path="${CONDA}/bin/conda"
          if [ ! -x "$conda_path" ]; then
            printf 'Conda executable is missing: %s\n' "$conda_path" >&2
            exit 1
          fi

          "$conda_path" create --yes --prefix "$tool_prefix" --override-channels \
            --channel conda-forge 'ffmpeg=8.1.2=gpl_*'
          ffmpeg_path="${tool_prefix}/bin/ffmpeg"
          ffprobe_path="${tool_prefix}/bin/ffprobe"
          if [ ! -x "$ffmpeg_path" ] || [ ! -x "$ffprobe_path" ]; then
            printf 'Fixed FFmpeg and ffprobe executables are missing.\n' >&2
            exit 1
          fi

          ffmpeg_version="$("$ffmpeg_path" -version | sed -n '1p')"
          ffprobe_version="$("$ffprobe_path" -version | sed -n '1p')"
          if [[ ! "$ffmpeg_version" =~ ^ffmpeg\ version\ 8\.1\.2([[:space:]]|$) ]]; then
            printf 'Unexpected FFmpeg version: %s\n' "$ffmpeg_version" >&2
            exit 1
          fi
          if [[ ! "$ffprobe_version" =~ ^ffprobe\ version\ 8\.1\.2([[:space:]]|$) ]]; then
            printf 'Unexpected ffprobe version: %s\n' "$ffprobe_version" >&2
            exit 1
          fi

          printf '%s\n' "${tool_prefix}/bin" >> "$GITHUB_PATH"
          printf 'VIDEOSCOPE_TEST_FFMPEG=%s\n' "$ffmpeg_path" >> "$GITHUB_ENV"
          printf 'VIDEOSCOPE_TEST_FFPROBE=%s\n' "$ffprobe_path" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$ffmpeg_version" "$ffprobe_version"

      - name: Install fixed FFmpeg 8.1.2 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolPrefix = Join-Path $env:RUNNER_TEMP "videoscope-ffmpeg-8.1.2"
          if (Test-Path -LiteralPath $toolPrefix) {
            throw "Refusing to reuse FFmpeg prefix: $toolPrefix"
          }
          if ([string]::IsNullOrWhiteSpace($env:CONDA)) {
            throw "GitHub runner did not expose the Miniconda root."
          }
          $condaPath = Join-Path $env:CONDA "Scripts\conda.exe"
          if (-not (Test-Path -LiteralPath $condaPath -PathType Leaf)) {
            throw "Conda executable is missing: $condaPath"
          }

          $installed = $false
          foreach ($attempt in 1..3) {
            & $condaPath create --yes --prefix $toolPrefix --override-channels `
              --channel conda-forge "ffmpeg=8.1.2=gpl_*"
            if ($LASTEXITCODE -eq 0) {
              $installed = $true
              break
            }
            Write-Warning "Conda FFmpeg install attempt $attempt failed."
            Start-Sleep -Seconds 10
          }

          if (-not $installed) {
            throw "Fixed FFmpeg environment could not be created after bounded retries."
          }

          $toolDirectory = Join-Path $toolPrefix "Library\bin"
          $ffmpegPath = Join-Path $toolDirectory "ffmpeg.exe"
          $ffprobePath = Join-Path $toolDirectory "ffprobe.exe"
          if (-not (Test-Path -LiteralPath $ffmpegPath -PathType Leaf) -or `
              -not (Test-Path -LiteralPath $ffprobePath -PathType Leaf)) {
            throw "Fixed FFmpeg and ffprobe executables are missing."
          }

          $env:PATH = "$toolDirectory;$env:PATH"
          $ffmpegCommand = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $ffprobeCommand = Get-Command ffprobe -ErrorAction SilentlyContinue
          if ($null -eq $ffmpegCommand -or $ffmpegCommand.Source -ne $ffmpegPath -or `
              $null -eq $ffprobeCommand -or $ffprobeCommand.Source -ne $ffprobePath) {
            throw "Fixed FFmpeg and ffprobe did not resolve from the isolated prefix."
          }

          $ffmpegVersion = (& $ffmpegPath -version | Select-Object -First 1)
          $ffprobeVersion = (& $ffprobePath -version | Select-Object -First 1)
          if ($ffmpegVersion -notmatch '^ffmpeg version 8\.1\.2(?:\s|$)') {
            throw "Unexpected FFmpeg version: $ffmpegVersion"
          }
          if ($ffprobeVersion -notmatch '^ffprobe version 8\.1\.2(?:\s|$)') {
            throw "Unexpected ffprobe version: $ffprobeVersion"
          }

          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIDEOSCOPE_TEST_FFMPEG=$ffmpegPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDEOSCOPE_TEST_FFPROBE=$ffprobePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output $ffmpegVersion
          Write-Output $ffprobeVersion

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Generate deterministic video fixtures
        run: python scripts/generate_test_videos.py --force

      - name: Exercise real Publish Ready profiles
        run: python -m pytest tests/resolve/test_fixture_publish.py -q

      - name: Exercise real Safe Sharing workflows
        run: python -m pytest tests/privacy/test_fixture_privacy.py -q

      - name: Exercise real Video Rescue workflows
        run: python -m pytest tests/rescue/test_fixture_rescue.py -q

      - name: Exercise real Long Video to Useful Content workflows
        run: python -m pytest tests/content/test_fixture_content.py tests/content/test_native_media.py tests/content/test_performance.py -q

      - name: Run repository verification
        run: python scripts/validate.py

      - name: Install locked front-end dependencies
        working-directory: web
        run: npm ci

      - name: Test dashboard
        working-directory: web
        run: npm test

      - name: Build packaged dashboard assets
        working-directory: web
        run: npm run build

      - name: Verify packaged dashboard assets are current
        shell: bash
        run: |
          static_changes="$(git status --porcelain --untracked-files=all -- src/videoscope/web/static)"
          if [ -n "$static_changes" ]; then
            printf '%s\n' "$static_changes"
            exit 1
          fi

      - name: Build wheel and source archive
        run: python -m build

      - name: Audit distribution contents
        run: python scripts/audit_distribution.py dist

      - name: Smoke-test clean base wheel
        run: python scripts/smoke_test.py --dist dist

  public-site:
    name: Audit and build public site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install locked dependencies
        working-directory: site
        run: npm ci

      - name: Audit production and development dependencies
        working-directory: site
        run: npm audit --audit-level=high

      - name: Generate project-authored media
        working-directory: site
        run: npm run media:prepare

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Type-check
        working-directory: site
        run: npm run typecheck

      - name: Test
        working-directory: site
        run: npm test

      - name: Build
        working-directory: site
        run: npm run build

      - name: Verify media provenance and build budgets
        working-directory: site
        run: npm run media:verify

  distribution:
    name: Build and smoke-test distribution
    runs-on: ubuntu-latest
    needs:
      - test
      - public-site

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install fixed FFmpeg 8.1.2
        shell: bash
        run: |
          set -euo pipefail
          tool_prefix="${RUNNER_TEMP}/videoscope-ffmpeg-8.1.2"
          if [ -e "$tool_prefix" ]; then
            printf 'Refusing to reuse FFmpeg prefix: %s\n' "$tool_prefix" >&2
            exit 1
          fi
          if [ -z "${CONDA:-}" ]; then
            printf 'GitHub runner did not expose the Miniconda root.\n' >&2
            exit 1
          fi
          conda_path="${CONDA}/bin/conda"
          if [ ! -x "$conda_path" ]; then
            printf 'Conda executable is missing: %s\n' "$conda_path" >&2
            exit 1
          fi

          "$conda_path" create --yes --prefix "$tool_prefix" --override-channels \
            --channel conda-forge 'ffmpeg=8.1.2=gpl_*'
          ffmpeg_path="${tool_prefix}/bin/ffmpeg"
          ffprobe_path="${tool_prefix}/bin/ffprobe"
          if [ ! -x "$ffmpeg_path" ] || [ ! -x "$ffprobe_path" ]; then
            printf 'Fixed FFmpeg and ffprobe executables are missing.\n' >&2
            exit 1
          fi

          ffmpeg_version="$("$ffmpeg_path" -version | sed -n '1p')"
          ffprobe_version="$("$ffprobe_path" -version | sed -n '1p')"
          if [[ ! "$ffmpeg_version" =~ ^ffmpeg\ version\ 8\.1\.2([[:space:]]|$) ]]; then
            printf 'Unexpected FFmpeg version: %s\n' "$ffmpeg_version" >&2
            exit 1
          fi
          if [[ ! "$ffprobe_version" =~ ^ffprobe\ version\ 8\.1\.2([[:space:]]|$) ]]; then
            printf 'Unexpected ffprobe version: %s\n' "$ffprobe_version" >&2
            exit 1
          fi

          printf '%s\n' "${tool_prefix}/bin" >> "$GITHUB_PATH"
          printf 'VIDEOSCOPE_TEST_FFMPEG=%s\n' "$ffmpeg_path" >> "$GITHUB_ENV"
          printf 'VIDEOSCOPE_TEST_FFPROBE=%s\n' "$ffprobe_path" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$ffmpeg_version" "$ffprobe_version"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Generate deterministic video fixtures
        run: python scripts/generate_test_videos.py --force

      - name: Run repository verification
        run: python scripts/validate.py

      - name: Exercise real Video Rescue workflows
        run: python -m pytest tests/rescue/test_fixture_rescue.py -q

      - name: Exercise real Long Video to Useful Content workflows
        run: python -m pytest tests/content/test_fixture_content.py tests/content/test_native_media.py tests/content/test_performance.py -q

      - name: Install locked front-end dependencies
        working-directory: web
        run: npm ci

      - name: Build current packaged dashboard assets
        working-directory: web
        run: npm run build

      - name: Verify packaged dashboard assets are current
        shell: bash
        run: |
          static_changes="$(git status --porcelain --untracked-files=all -- src/videoscope/web/static)"
          if [ -n "$static_changes" ]; then
            printf '%s\n' "$static_changes"
            exit 1
          fi

      - name: Build wheel and source archive
        run: python -m build

      - name: Audit distribution contents
        run: python scripts/audit_distribution.py dist

      - name: Smoke-test wheel in a clean virtual environment
        run: python scripts/smoke_test.py --dist dist --video tests/fixtures/generated/privacy_manual_visual.mp4

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: genvideoscope-distributions
          path: dist/*
          if-no-files-found: error
